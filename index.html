<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬파티</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F5F9;--ink:#1A2238;--mute:#5B6579;--line:#D5DCE6;--acc:#2F5BFF;--stamp:#E8503A;--card:#fff;--hero:#1A2238;--onhero:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141F;--ink:#EEF1F7;--mute:#98A2B8;--line:#2A3247;--acc:#7C97FF;--stamp:#FF7A63;--card:#181E2E;--hero:#2A3556}}
:root[data-theme="dark"]{--bg:#10141F;--ink:#EEF1F7;--mute:#98A2B8;--line:#2A3247;--acc:#7C97FF;--stamp:#FF7A63;--card:#181E2E;--hero:#2A3556}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 18px 110px}
h1,h2{margin:0;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400}
h2{font-size:22px;margin-bottom:12px}
section{margin-top:36px}
.brand{font-size:36px;color:var(--acc)}.brand+.sub{margin:2px 0 0}
.top{margin-top:24px;display:flex;align-items:flex-end;gap:10px}
.big{font:400 84px/1 "Black Han Sans","Noto Sans KR",sans-serif;color:var(--stamp)}
.top p{margin:0 0 10px;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.today{background:var(--hero);color:var(--onhero);border-radius:20px;padding:20px;margin-top:20px}
.today h2{color:var(--onhero)}
.pick{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.18)}
.pick b{display:block}.pick span{opacity:.75;font-size:14px}
.pick a{display:block;color:var(--onhero);font-size:14px}
.tag{font-size:13px;opacity:.8;white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{background:var(--stamp);color:#fff;font-weight:700;width:100%;margin-top:14px}
.ghost{background:transparent;color:inherit;border:1px solid currentColor;width:100%;margin-top:8px}
.done{margin-top:14px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal i{font-style:normal;font-size:12px;color:var(--mute)}
.cal div{aspect-ratio:1;display:grid;place-items:center;font-size:13px;color:var(--mute);border-radius:50%}
.cal .on{background:var(--stamp);color:#fff;font-weight:700;transform:rotate(-8deg)}
.cal .now{outline:2px solid var(--acc);outline-offset:-2px;color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:block;font-size:13px;color:var(--mute)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.save{background:var(--acc);color:#fff;font-weight:700;margin-top:10px;width:100%}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
td,th{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);font-weight:400}
th:first-child,td:first-child{text-align:left}
.up{color:var(--stamp)}.dn{color:var(--acc)}
ul{list-style:none;margin:14px 0 0;padding:0}
span.chip{display:inline-block;padding:8px 14px;border-radius:12px}li .drow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;width:100%;background:transparent;color:var(--ink);padding:8px 0;min-height:44px;text-align:left;border-radius:8px;font-size:15px}.vbtn{display:inline-flex;align-items:center;background:var(--hero);color:var(--onhero)!important;border-radius:12px;padding:8px 14px!important;min-height:40px;font-weight:700;text-decoration:none}.pcard{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);margin-top:14px}.pcard label{margin-top:8px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 14px;min-height:40px}.chip.sel{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}.info{flex-basis:100%;font-size:14px;color:var(--mute);line-height:1.5}.pick .tp{display:block}.quote{border-left:4px solid var(--stamp);padding:6px 0 6px 14px;margin-top:24px}.quote p{margin:0;font-size:18px;font-weight:700;line-height:1.5}.shorts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shorts li{display:block;padding:0;border:0}.shot{position:relative;display:block;aspect-ratio:9/16;border-radius:16px;overflow:hidden;color:#fff;text-decoration:none;background-size:cover;background-position:center}.shot .ov{position:absolute;left:0;right:0;bottom:0;padding:32px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:14px;line-height:1.35}.shot .ov small{display:block;opacity:.85;color:#fff}.shot .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:18px}.shot .fv{position:absolute;top:8px;right:10px;font-size:18px}
li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
li small{color:var(--mute)}
li button{background:transparent;color:var(--mute);padding:6px 10px;min-height:36px}
li a{color:var(--acc);font-size:14px;margin-left:auto;padding:0 10px}
.add{display:grid;grid-template-columns:1fr 100px;gap:8px}
.add button{grid-column:1/-1}
.join{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.join button{grid-column:1/-1}.join .w{grid-column:1/-1}
.crew{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.slot{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);min-height:112px;display:flex;flex-direction:column;gap:4px}
.slot.me{border:2px solid var(--acc)}
.slot.empty{border-style:dashed;color:var(--mute);align-items:center;justify-content:center;text-align:center;font-size:14px;background:transparent}
.slot b{font-size:17px}
.st{font-size:14px;color:var(--mute)}.st.ok{color:var(--stamp);font-weight:700}
.toast{background:var(--hero);color:var(--onhero);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-weight:700}
li .yes{background:var(--acc);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:transparent;color:var(--mute);font-size:12px;line-height:1.25;padding:8px 2px;border-radius:10px}
nav button.cur{color:var(--acc);font-weight:700;background:var(--bg)}
@media(prefers-reduced-motion:no-preference){.on{animation:st .35s ease-out}@keyframes st{from{transform:scale(1.6) rotate(-20deg);opacity:0}}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KEY='inbody-routine-v1',PARTS=['가슴','등','하체','어깨','팔','복부','허리','코어','유산소'];
var DEF=[['덤벨 프레스','가슴'],['밴드 로우','등'],['맨몸 스쿼트','하체'],['덤벨 숄더 프레스','어깨'],['플랭크','코어'],['줄넘기','유산소']];
var KW=[['유산소',['줄넘기','러닝','런닝','트레드밀','사이클','싸이클','자전거','로잉','스텝','버피','점핑','조깅','걷기']],['어깨',['숄더','레터럴','사이드레이즈','오버헤드','밀리터리','페이스풀','업라이트']],['허리',['백익스텐션','하이퍼','슈퍼맨','굿모닝','허리']],['복부',['크런치','복근','싯업','윗몸','레그레이즈','바이시클','복부']],['코어',['플랭크','러시안','롤아웃','마운틴','버드독','코어']],['하체',['스쿼트','런지','레그','데드리프트','힙','카프','종아리','브릿지','하체']],['등',['로우','풀업','턱걸이','랫','풀다운','친업','등']],['팔',['컬','트라이셉','이두','삼두','킥백','해머']],['가슴',['벤치','푸시업','푸쉬업','팔굽','체스트','펙덱','플라이','딥스','프레스','가슴']]];
var DEFINFO={'덤벨 프레스':['가슴(대흉근), 어깨 앞쪽, 삼두',['벤치에 누워 덤벨을 가슴 옆에 잡아요','팔꿈치를 펴며 덤벨을 위로 밀어 올려요','천천히 시작 위치로 내려요']],'밴드 로우':['등(광배근, 능형근), 이두',['밴드를 고정하고 앉아 양손으로 잡아요','견갑골을 모으며 팔꿈치를 뒤로 당겨요','천천히 풀어 주세요']],'맨몸 스쿼트':['허벅지 앞(대퇴사두), 엉덩이',['발을 어깨너비로 벌리고 서요','엉덩이를 뒤로 빼며 앉아요','무릎이 발끝을 넘지 않게 일어나요']],'덤벨 숄더 프레스':['어깨(삼각근), 삼두',['덤벨을 어깨 높이에서 잡아요','팔을 머리 위로 곧게 밀어 올려요','천천히 어깨 높이로 내려요']],'플랭크':['복부, 코어 전체, 허리',['팔꿈치를 어깨 아래에 두고 엎드려요','머리부터 발끝까지 일직선을 유지해요','숨을 쉬며 시간을 채워요']],'줄넘기':['종아리, 허벅지, 전신 유산소',['손목으로 줄을 돌려요','발끝으로 가볍게 뛰어요','일정한 리듬을 유지해요']]};
var S=load();if(!S.vids)S.vids=[{id:'v1',url:'https://www.youtube.com/@muscletv111',title:'muscletv111',part:'전체',fav:false,last:''}];S.vids.forEach(function(v){v.title=v.title.replace(' (예시 채널)','')});if(!S.wt)S.wt=[];S.equip.forEach(function(e){if(!e.how&&DEFINFO[e.n]){e.m=DEFINFO[e.n][0];e.how=DEFINFO[e.n][1]}});
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
return{equip:DEF.map(function(x){return{n:x[0],p:x[1],last:''}}),days:[],log:{},inbody:[],shuf:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pad(n){return(n<10?'0':'')+n}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function add(s,n){var a=s.split('-').map(Number);return fmt(new Date(a[0],a[1]-1,a[2]+n))}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML.replace(/"/g,'&quot;')}
function yt(n){return'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' 사용법')}
function val(i){var e=document.getElementById(i);return e?e.value.trim():''}
var T=fmt(new Date()),TAB='main',TABS=[['main','메인'],['today','오늘의 운동'],['stamp','스탬프'],['record','기록'],['video','영상'],['reco','추천']];
var SOC='init',DB=null,UID=null,ME=null,CREW=[],INV=[],BUSY=false,MSG='',FN='',FK='';
function M(n){return'\x01'+n+'\x01'}
function nav(){return'<nav aria-label="메뉴">'+TABS.map(function(t){return'<button data-a="tab" data-t="'+t[0]+'"'+(t[0]===TAB?' class="cur" aria-current="page"':'')+'>'+t[1]+'</button>'}).join('')+'</nav>'}
function dose(p){return p==='코어'?'3세트 × 40초':p==='유산소'?'5분':'3세트 × 12회'}
function streak(){var d=S.days.indexOf(T)>-1?T:add(T,-1),c=0;while(S.days.indexOf(d)>-1){c++;d=add(d,-1)}return c}
function picks(){
 if(S.plan&&S.plan.d===T)return S.plan.items;
 if(S.log[T])return S.log[T].map(function(n){return S.equip.filter(function(e){return e.n===n})[0]||{n:n,p:''}});
 var l=S.equip.slice().sort(function(a,b){return a.last<b.last?-1:a.last>b.last?1:0});
 if(!l.length)return[];
 var o=(S.shuf[T]||0)%l.length,r=l.slice(o).concat(l.slice(0,o)),out=[],seen={};
 r.forEach(function(x){if(!seen[x.p]&&out.length<3){seen[x.p]=1;out.push(x)}});
 r.forEach(function(x){if(out.length<3&&out.indexOf(x)<0)out.push(x)});
 return out}
function delta(a,b,u){if(b==null)return'';var v=Math.round((a-b)*10)/10;return v===0?'<span>–</span>':'<span class="'+(v>0?'up':'dn')+'">'+(v>0?'+':'')+v+u+'</span>'}
function guess(n){var s=n.replace(/\s/g,'').toLowerCase();for(var i=0;i<KW.length;i++)for(var j=0;j<KW[i][1].length;j++)if(s.indexOf(KW[i][1][j])>-1)return KW[i][0];return''}
async function addEquip(b){
 var n=val('en'),p=VP,hint=p,info=null;
 if(!n){alert('운동기구 이름을 입력해 주세요.');return}
 b.disabled=true;b.textContent='사용법 정리 중...';
 try{var sm=await claude.use('sample');
  if(sm){var r=await sm.json('운동기구 또는 운동 이름: '+n+'\n부위 힌트: '+(hint||'없음')+'\n다음 JSON으로만 답하세요. part는 '+PARTS.join(', ')+' 중 하나, muscles는 자극되는 주요 근육을 쉼표로 구분한 한 줄, steps는 사용법 3~4단계(각 40자 이내)예요.\n{"part":"","muscles":"","steps":["",""]}',{modelTier:'quick'});
   if(r&&Array.isArray(r.steps)){info={m:String(r.muscles||'').slice(0,60),how:r.steps.slice(0,4).map(function(s){return String(s).slice(0,60)})};
    if(p==='auto'&&!hint&&PARTS.indexOf(r.part)>-1)hint=r.part}}}catch(e){}
 b.disabled=false;b.textContent='운동기구 추가';
 p=p==='auto'?hint:p;
 if(!p){alert('부위를 자동으로 찾지 못했어요. 부위를 직접 골라 주세요.');return}
 var it={n:n,p:p,last:''};if(info){it.m=info.m;it.how=info.how}
 S.equip.push(it);S.shuf[T]=0;save();render()}
var PEND=null,PB=false,PMSG='';
function shrink(file){return new Promise(function(ok,no){var fr=new FileReader();fr.onerror=no;fr.onload=function(){var im=new Image();im.onerror=no;im.onload=function(){var s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?ok(b):no()},'image/jpeg',0.82)};im.src=fr.result};fr.readAsDataURL(file)})}
async function fromPhoto(file){
 PB=true;PMSG='';PEND=null;render();
 try{var blob=await shrink(file),sm=await claude.use('sample');
  if(!sm)throw 0;var lim=await sm.limits();if(!lim.images)throw 0;
  var r=await sm.json('사진 속 운동기구(또는 운동 장면)가 무엇인지 알아보세요. 한국 헬스장에서 흔히 부르는 이름을 쓰세요.\n다음 JSON으로만 답하세요. 알아볼 수 없으면 {"ok":false}만 답하세요. part는 '+PARTS.join(', ')+' 중 하나, muscles는 자극되는 주요 근육을 쉼표로 구분한 한 줄, steps는 사용법 3~4단계(각 40자 이내)예요.\n{"ok":true,"name":"","part":"","muscles":"","steps":["",""]}',{images:[blob],modelTier:'quick',cache:false});
  if(r&&r.ok&&r.name&&Array.isArray(r.steps))PEND={n:String(r.name).slice(0,20),p:PARTS.indexOf(r.part)>-1?r.part:(guess(String(r.name))||PARTS[0]),m:String(r.muscles||'').slice(0,60),how:r.steps.slice(0,4).map(function(s){return String(s).slice(0,60)})};
  else PMSG='사진에서 운동기구를 알아보지 못했어요. 기구 전체가 잘 보이게 다시 찍어 주세요.'
 }catch(e){PMSG='사진으로 찾기를 지금 쓸 수 없어요. 이름을 직접 입력해 주세요.'}
 PB=false;render()}
function pendHtml(){
 if(PB)return'<p class="sub">사진을 살펴보는 중...</p>';
 var h=PMSG?'<p class="toast" role="status">'+esc(PMSG)+'</p>':'';
 if(!PEND)return h;
 return h+'<div class="pcard"><label for="pn">찾은 운동기구 이름 (고쳐 쓸 수 있어요)</label><input id="pn" maxlength="20" value="'+esc(PEND.n)+'"><label for="pp">부위</label><select id="pp">'+PARTS.map(function(p){return'<option'+(p===PEND.p?' selected':'')+'>'+p+'</option>'}).join('')+'</select><div class="info" style="margin-top:8px">자극 부위: <b>'+esc(PEND.m)+'</b>'+PEND.how.map(function(s,k){return'<div>'+(k+1)+'. '+esc(s)+'</div>'}).join('')+'</div><button class="save" data-a="pyes">이 운동기구 추가하기</button><button class="ghost" data-a="pno">취소</button></div>'}
var VP='가슴',RD=null,DQ='',PB2=false;
var SUG={'가슴':['푸시업','벤치 프레스','덤벨 플라이','딥스'],'등':['랫 풀다운','시티드 로우','풀업','원암 덤벨 로우'],'하체':['런지','레그 프레스','데드리프트','힙 브릿지'],'어깨':['사이드 레터럴 레이즈','숄더 프레스','프론트 레이즈','페이스 풀'],'팔':['덤벨 컬','트라이셉 익스텐션','해머 컬','킥백'],'복부':['크런치','레그 레이즈','바이시클 크런치','싯업'],'허리':['백 익스텐션','슈퍼맨','굿모닝','버드독'],'코어':['플랭크','사이드 플랭크','러시안 트위스트','마운틴 클라이머'],'유산소':['러닝','자전거','줄넘기','버피']};
function sortIb(){S.inbody.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
function r1(x){return Math.round(x*10)/10}

 if(!list.length)return'<p class="sub">이 달에는 체중 기록이 없어요. 운동한 날은 '+ex+'일이에요.</p>';
 var f=list[0],l=list[list.length-1],ws=list.map(function(e){return e.w}),avg=r1(ws.reduce(function(a,b){return a+b},0)/ws.length),mn=Math.min.apply(null,ws),mx=Math.max.apply(null,ws),dl=r1(l.w-f.w);
 var msg=list.length<2?'기록이 하나뿐이라 변화는 아직 알 수 없어요.':dl<0?'이 달에 체중이 '+(-dl)+'kg 줄었어요.':dl>0?'이 달에 체중이 '+dl+'kg 늘었어요.':'이 달 체중이 그대로였어요.';
 return'<div class="pcard"><b>'+esc(msg)+'</b><p class="sub" style="margin-top:6px">'+list.length+'일 기록, 평균 '+avg+'kg. 처음 '+f.w+'kg('+f.d.slice(5)+') → 마지막 '+l.w+'kg('+l.d.slice(5)+'). 가장 낮은 날 '+mn+'kg, 가장 높은 날 '+mx+'kg. 이 달 운동한 날은 '+ex+'일이에요.</p></div>'}
function wtChart(list,ym){
 if(list.length<2)return'<p class="sub" style="margin-top:12px">체중을 이 달에 2번 이상 기록하면 그래프가 나와요.</p>';
 var nd=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate(),W=320,H=180,L=36,R=12,Tp=14,B=34;
 var ws=list.map(function(e){return e.w}),lo=Math.min.apply(null,ws),hi=Math.max.apply(null,ws),pd=Math.max((hi-lo)*0.25,0.5);lo-=pd;hi+=pd;
 function X(d){return L+(W-L-R)*(d-1)/Math.max(nd-1,1)}
 function Y(v){return Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo))}
 var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+ym+' 체중 변화 그래프" style="width:100%;height:auto;margin-top:12px">';
 [hi,(hi+lo)/2,lo].forEach(function(v){var y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" style="fill:var(--mute)">'+r1(v)+'</text>'});
 [1,8,15,22,nd].forEach(function(d){s+='<text x="'+X(d)+'" y="'+(H-B+14)+'" text-anchor="middle" font-size="10" style="fill:var(--mute)">'+d+'</text>'});
 S.days.forEach(function(x){if(x.slice(0,7)===ym)s+='<circle cx="'+X(+x.slice(8))+'" cy="'+(H-8)+'" r="3.5" style="fill:var(--stamp)"/>'});
 s+='<polyline fill="none" stroke-width="2" stroke-linejoin="round" points="'+list.map(function(e){return X(+e.d.slice(8))+','+Y(e.w)}).join(' ')+'" style="stroke:var(--acc)"/>';
 list.forEach(function(e){s+='<circle cx="'+X(+e.d.slice(8))+'" cy="'+Y(e.w)+'" r="3.5" style="fill:var(--acc)"/>'});
 return s+'</svg><p class="sub">파란 선은 체중이고, 아래 붉은 점은 운동한 날이에요.</p>'}
function wtHtml(){

 var h='<section><h2>체중 기록</h2><div class="row" style="grid-template-columns:1fr 1fr"><div><label for="wd">날짜</label><input id="wd" type="date" value="'+T+'" max="'+T+'"></div><div><label for="wv">체중 (kg)</label><input id="wv" type="number" step="0.1" inputmode="decimal"></div></div><button class="save" data-a="wsave">체중 저장</button>';

 if(list.length){h+='<ul>';list.slice().reverse().forEach(function(e){h+='<li><span>'+e.d.slice(5)+' <b>'+e.w+' kg</b></span><button data-a="wdel" data-d="'+e.d+'">'+(WQ===e.d?'한 번 더 눌러 삭제':'삭제')+'</button></li>'});h+='</ul>'}

function wkKey(){var d=new Date();return add(T,-((d.getDay()+6)%7))}
function PREF(){var p=S.pref;if(!p||p.wk!==wkKey()){p=S.pref={wk:wkKey(),focus:[],level:(p&&p.level)||'보통'}}return p}
var LV={'가볍게':[2,'10회',60,'5분',30],'보통':[3,'12회',45,'10분',40],'강하게':[4,'15회',30,'15분',60]};
function lvDose(lv,p){var v=LV[lv]||LV['보통'];return p==='유산소'?v[3]:p==='코어'?v[0]+'세트 × '+v[4]+'초':v[0]+'세트 × '+v[1]+' (휴식 '+v[2]+'초)'}
function localPlan(pool,lv){return pool.slice().sort(function(a,b){return a.last<b.last?-1:a.last>b.last?1:0}).slice(0,4).map(function(e){return{n:e.n,p:e.p,dose:lvDose(lv,e.p),tip:''}})}
async function makeRoutine(b){
 var pf=PREF();
 if(S.log[T]){alert('오늘 운동은 이미 완료했어요. 내일 다시 만들어 주세요.');return}
 if(!pf.focus.length){alert('이번 주에 주로 할 운동 부위를 하나 이상 골라 주세요.');return}
 var pool=S.equip.filter(function(e){return pf.focus.indexOf(e.p)>-1});
 if(!pool.length){alert('선택한 부위에 등록된 운동기구가 없어요. 영상 탭에서 추가해 주세요.');return}
 b.disabled=true;b.textContent='루틴 만드는 중...';
 var items=null;
 try{var sm=await claude.use('sample');
  if(sm){var r=await sm.json('등록된 운동기구 목록: '+pool.map(function(e){return e.n+'('+e.p+')'}).join(', ')+'\n이번 주 주로 할 운동: '+pf.focus.join(', ')+'\n강도: '+pf.level+'\n이 목록에 있는 운동기구만 사용해서 오늘의 운동 루틴을 3~5개로 구성하세요. n은 목록의 이름과 정확히 같아야 해요. 강도에 맞게 sets(세트 수), reps(횟수 또는 시간), rest(휴식 초), tip(자세 팁 한 줄, 30자 이내)을 정하세요. JSON으로만 답하세요.\n{"items":[{"n":"","sets":3,"reps":"12회","rest":45,"tip":""}]}',{modelTier:'quick',cache:false});
   if(r&&Array.isArray(r.items))items=r.items.map(function(x){var e=pool.filter(function(q){return q.n===x.n})[0];if(!e)return null;var s=Math.min(Math.max(+x.sets||3,1),6),rest=+x.rest||0;return{n:e.n,p:e.p,dose:s+'세트 × '+String(x.reps||'12회').slice(0,12)+(rest?' (휴식 '+rest+'초)':''),tip:String(x.tip||'').slice(0,40)}}).filter(Boolean).slice(0,5)}}catch(e){}
 if(!items||!items.length)items=localPlan(pool,pf.level);
 S.plan={d:T,items:items};save();render()}

async function signUp(){
 var nm=val('sn').slice(0,10),nk=val('sk').slice(0,8);FN=nm;FK=nk;
 if(!nm||!nk){alert('이름과 별명을 모두 입력해 주세요.');return}
 BUSY=true;MSG='';render();
 try{var no='';
  for(var i=0;i<6&&!no;i++){var c=String(Math.floor(100000+Math.random()*900000));var q=await DB.collection('members').where('no','==',c).limit(1).get();if(q.empty)no=c}
  if(!no)throw 0;
  await DB.collection('data/users/'+UID).doc('profile').set({name:nm,nick:nk,no:no});
  await DB.doc('members/'+UID).set({no:no,nick:nk,host:UID,done:S.days.indexOf(T)>-1?T:''});
  ME={no:no,nick:nk,host:UID};await loadSocial()
 }catch(e){MSG='가입하지 못했어요. 잠시 후 다시 시도해 주세요.'}

async function sendInvite(){

 if(!/^\d{6}$/.test(no)){alert('회원번호 6자리 숫자를 입력해 주세요.');return}

   await DB.doc('members/'+UID).update({host:v.host});ME.host=v.host}
  await DB.doc('invites/'+id).update({status:ok?'accepted':'declined'})
