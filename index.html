<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬파티</title>
<style>
:root{--bg:#F2F5F9;--ink:#1A2238;--mute:#5B6579;--line:#D5DCE6;--acc:#2F5BFF;--stamp:#E8503A;--card:#fff;--hero:#1A2238;--onhero:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141F;--ink:#EEF1F7;--mute:#98A2B8;--line:#2A3247;--acc:#7C97FF;--stamp:#FF7A63;--card:#181E2E;--hero:#2A3556}}
:root[data-theme="dark"]{--bg:#10141F;--ink:#EEF1F7;--mute:#98A2B8;--line:#2A3247;--acc:#7C97FF;--stamp:#FF7A63;--card:#181E2E;--hero:#2A3556}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 18px 110px}
h1,h2{margin:0;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400}
h2{font-size:22px;margin-bottom:12px}
section{margin-top:36px}
.brand{font-size:36px;color:var(--acc)}.brand+.sub{margin:2px 0 0}
.top{margin-top:24px;display:flex;align-items:flex-end;gap:10px}
.big{font:400 84px/1 "Black Han Sans","Noto Sans KR",sans-serif;color:var(--stamp)}
.top p{margin:0 0 10px;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.today{background:var(--hero);color:var(--onhero);border-radius:20px;padding:20px;margin-top:20px}
.today h2{color:var(--onhero)}
.pick{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.18)}
.pick b{display:block}.pick span{opacity:.75;font-size:14px}
.pick a{display:block;color:var(--onhero);font-size:14px}
.tag{font-size:13px;opacity:.8;white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{background:var(--stamp);color:#fff;font-weight:700;width:100%;margin-top:14px}
.ghost{background:transparent;color:inherit;border:1px solid currentColor;width:100%;margin-top:8px}
.done{margin-top:14px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal i{font-style:normal;font-size:12px;color:var(--mute)}
.cal div{aspect-ratio:1;display:grid;place-items:center;font-size:13px;color:var(--mute);border-radius:50%}
.cal .on{background:var(--stamp);color:#fff;font-weight:700;transform:rotate(-8deg)}
.cal .now{outline:2px solid var(--acc);outline-offset:-2px;color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:block;font-size:13px;color:var(--mute)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.save{background:var(--acc);color:#fff;font-weight:700;margin-top:10px;width:100%}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
td,th{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);font-weight:400}
th:first-child,td:first-child{text-align:left}
.up{color:var(--stamp)}.dn{color:var(--acc)}
ul{list-style:none;margin:14px 0 0;padding:0}

3366;padding:0;min-height:0;position:relative;background-size:cover;background-position:center}.rt .th{font-size:30px}.rt .th .cam{position:absolute;right:2px;bottom:2px;font-size:12px;line-height:1.2;background:rgba(7,7,33,.75);border-radius:8px;padding:1px 3px}.bars{display:flex;gap:2px}.bars i{width:12px;height:12px;border-radius:2px;background:#2A3366}.bars i.on2{background:#2F6BFF}.rm b{display:block;font-size:16px;line-height:1.3;margin-top:3px}.rs{color:#A9AFC4;font-size:14px}.mu{text-align:center;font-size:12px;font-weight:700}.fig{width:64px;height:64px;padding:0;min-height:0;border:1px solid #2A3366;border-radius:14px;background:#10143a;display:grid;place-items:center}.fig.pic{background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center}.rf{background:#10143a;border-radius:14px;padding:12px;margin:0 0 8px}.rf input{background:#0b0e30;color:#fff;border-color:#2A3366}.rf label{color:#A9AFC4}.rf select{background:#0b0e30;color:#fff;border-color:#2A3366}.rf .rr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.rmenu{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:8px}.rmenu button{background:#1B1F45;color:#fff;font-size:14px;padding:6px 12px;min-height:36px}.rt .chip{background:#1B1F45;color:#fff;border-color:#2A3366}.info2{color:#C9CEE6;font-size:14px}.zoom{background:#10143a;border-radius:14px;padding:10px;margin:0 0 8px}.vlk{color:#8DB0FF;font-size:13px;display:inline-flex;align-items:center;min-height:32px;text-decoration:none;margin-right:10px}.zh{margin-top:8px;font-size:14px;color:#E8EBFF}.zh div{padding:3px 0}.zh b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#2F6BFF;color:#fff;font-size:12px;margin-right:6px}.sets{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 10px 72px}.sl,.sr{color:#A9AFC4;font-size:13px}.sr{margin-left:4px}.rt .sb{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;background:#1B1F45;color:#fff;font-size:14px;border:1px solid #2A3366}.rt .sb.on3{background:#2F6BFF;border-color:#2F6BFF}.tm{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;padding:0 12px;z-index:5;display:none}.tmw{position:relative;overflow:hidden;background:#070721;color:#fff;border-radius:14px;border:1px solid #2A3366;box-shadow:0 6px 18px rgba(0,0,0,.35)}.tmb{position:absolute;left:0;top:0;bottom:0;background:#1d4ed8;opacity:.55;transition:width .25s linear}.tmr{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px}.tmr b{flex:1;font-size:18px}.tmr button{background:#1B1F45;color:#fff;min-height:36px;padding:6px 12px;font-size:14px}.zt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.zi{aspect-ratio:1;background:#fff no-repeat center/contain;border-radius:12px;display:grid;place-items:center;font-size:48px}.quote{border-left:4px solid var(--stamp);padding:6px 0 6px 14px;margin-top:24px}.quote p{margin:0;font-size:18px;font-weight:700;line-height:1.5}.shorts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shorts li{display:block;padding:0;border:0}.shot{position:relative;display:block;aspect-ratio:9/16;border-radius:16px;overflow:hidden;color:#fff;text-decoration:none;background-size:cover;background-position:center}.shot .ov{position:absolute;left:0;right:0;bottom:0;padding:32px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:14px;line-height:1.35}.shot .ov small{display:block;opacity:.85;color:#fff}.shot .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:18px}.shot .fv{position:absolute;top:8px;right:10px;font-size:18px}
li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
li small{color:var(--mute)}
li button{background:transparent;color:var(--mute);padding:6px 10px;min-height:36px}
li a{color:var(--acc);font-size:14px;margin-left:auto;padding:0 10px}
.add{display:grid;grid-template-columns:1fr 100px;gap:8px}
.add button{grid-column:1/-1}
.join{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.join button{grid-column:1/-1}.join .w{grid-column:1/-1}
.crew{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.slot{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);min-height:112px;display:flex;flex-direction:column;gap:4px}
.slot.me{border:2px solid var(--acc)}
.slot.empty{border-style:dashed;color:var(--mute);align-items:center;justify-content:center;text-align:center;font-size:14px;background:transparent}
.slot b{font-size:17px}
.st{font-size:14px;color:var(--mute)}.st.ok{color:var(--stamp);font-weight:700}
.toast{background:var(--hero);color:var(--onhero);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-weight:700}
li .yes{background:var(--acc);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:transparent;color:var(--mute);font-size:12px;line-height:1.25;padding:8px 2px;border-radius:10px}
nav button.cur{color:var(--acc);font-weight:700;background:var(--bg)}
@media(prefers-reduced-motion:no-preference){.on{animation:st .35s ease-out}@keyframes st{from{transform:scale(1.6) rotate(-20deg);opacity:0}}}
</style>

function lvDose(lv,p){var d=rtDef(lv,p);return d.sets+'세트 × '+d.reps}
function localPlan(pool,lv){
 var pf=PREF(),L=LVN[lv]||lv,cnt=CN[L]||3,out=[],seen={};
 var by=function(a,b){return a.last<b.last?-1:a.last>b.last?1:0};
 var srt=pool.filter(function(e){return e.p!=='유산소'&&e.p!=='마사지'}).sort(by);
 srt.forEach(function(e){if(out.length<cnt&&!seen[e.p]){seen[e.p]=1;out.push(e)}});
 srt.forEach(function(e){if(out.length<cnt&&out.indexOf(e)<0)out.push(e)});
 var other=pool.filter(function(e){return e.p==='유산소'||e.p==='마사지'}).sort(by);
 if(pf.goal==='다이어트'){var cd=S.equip.filter(function(e){return e.p==='유산소'}).sort(by)[0];if(cd&&other.indexOf(cd)<0)other.unshift(cd);var c1=other.filter(function(e){return e.p==='유산소'})[0];if(c1)out.push(c1)}
 else if(!out.length)other.slice(0,cnt).forEach(function(e){out.push(e)});
 return out.map(function(e,i){var x=Object.assign({n:e.n,p:e.p,tip:''},rtDef(lv,e.p));
  if(pf.goal==='근육증량'&&i>=2&&e.p!=='유산소'&&e.p!=='마사지'&&e.p!=='코어'){x.reps='12회';x.rest=60;x.mode='마무리: 가볍게 12회로 자극을 채워요'}
  return x})}
async function makeRoutine(b){
 var pf=PREF();
 if(S.log[T]){alert('오늘 운동은 이미 완료했어요. 내일 다시 만들어 주세요.');return}
 if(!pf.focus.length){alert('이번 주에 주로 할 운동 부위를 하나 이상 골라 주세요.');return}
 var pool=S.equip.filter(function(e){return pf.focus.indexOf(e.p)>-1||(pf.goal==='다이어트'&&e.p==='유산소')});
 if(!pool.length){alert('선택한 부위에 등록된 운동기구가 없어요. 영상 탭에서 추가해 주세요.');return}
 b.disabled=true;b.textContent='루틴 만드는 중...';
 var items=null;
 try{var sm=await claude.use('sample');
  if(sm){var r=await sm.json('등록된 운동기구 목록: '+pool.map(function(e){return e.n+'('+e.p+')'}).join(', ')+'\n이번 주 주로 할 운동: '+pf.focus.join(', ')+'\n레벨: '+pf.level+'\n목적: '+pf.goal+'\n이 목록에 있는 운동기구만 사용해서 오늘의 운동 루틴을 '+(CN[pf.level]||3)+'개 안팎으로 구성하세요. n은 목록의 이름과 정확히 같아야 해요. 다이어트는 반복 수를 높이고 휴식을 짧게(서킷, 인터벌), 근육증량은 중간 반복과 긴 휴식(피라미드, 드롭세트)으로 하세요. 초급과 중급은 세트 사이 휴식을 모두 60초로 하고, 초급은 단순하게, 고급은 변화를 주세요. sets(세트 수), reps(횟수 또는 시간), rest(휴식 초), mode(세트 방식 한 줄, 30자 이내), tip(자세 팁 한 줄, 30자 이내)을 정하세요. JSON으로만 답하세요.\n{"items":[{"n":"","sets":3,"reps":"12회","rest":45,"mode":"","tip":""}]}',{modelTier:'quick',cache:false});
   if(r&&Array.isArray(r.items))items=r.items.map(function(x){var e=pool.filter(function(q){return q.n===x.n})[0];if(!e)return null;var s=Math.min(Math.max(+x.sets||3,1),6),rest=+x.rest||0;return{n:e.n,p:e.p,sets:s,reps:String(x.reps||'12회').slice(0,12),rest:rest>0?rest:60,mode:String(x.mode||'').slice(0,40),tip:String(x.tip||'').slice(0,40)}}).filter(Boolean).slice(0,6).map(function(x){if((pf.level==='초급'||pf.level==='중급')&&x.p!=='유산소'&&x.p!=='마사지')x.rest=60;return x})}}catch(e){}
 if(!items||!items.length)items=localPlan(pool,pf.level);
 S.plan={d:T,items:items};save();render()}
