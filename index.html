<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬파티</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F5F9;--ink:#1A2238;--mute:#5B6579;--line:#D5DCE6;--acc:#2F5BFF;--stamp:#E8503A;--card:#fff;--hero:#1A2238;--onhero:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141F;--ink:#EEF1F7;--mute:#98A2B8;--line:#2A3247;--acc:#7C97FF;--stamp:#FF7A63;--card:#181E2E;--hero:#2A3556}}
:root[data-theme="dark"]{--bg:#10141F;--ink:#EEF1F7;--mute:#98A2B8;--line:#2A3247;--acc:#7C97FF;--stamp:#FF7A63;--card:#181E2E;--hero:#2A3556}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 18px 110px}
h1,h2{margin:0;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400}
h2{font-size:22px;margin-bottom:12px}
section{margin-top:36px}
.brand{font-size:36px;color:var(--acc)}.brand+.sub{margin:2px 0 0}
.top{margin-top:24px;display:flex;align-items:flex-end;gap:10px}
.big{font:400 84px/1 "Black Han Sans","Noto Sans KR",sans-serif;color:var(--stamp)}
.top p{margin:0 0 10px;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.today{background:var(--hero);color:var(--onhero);border-radius:20px;padding:20px;margin-top:20px}
.today h2{color:var(--onhero)}
.pick{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.18)}
.pick b{display:block}.pick span{opacity:.75;font-size:14px}
.pick a{display:block;color:var(--onhero);font-size:14px}
.tag{font-size:13px;opacity:.8;white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{background:var(--stamp);color:#fff;font-weight:700;width:100%;margin-top:14px}
.ghost{background:transparent;color:inherit;border:1px solid currentColor;width:100%;margin-top:8px}
.done{margin-top:14px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal i{font-style:normal;font-size:12px;color:var(--mute)}
.cal div{aspect-ratio:1;display:grid;place-items:center;font-size:13px;color:var(--mute);border-radius:50%}
.cal .on{background:var(--stamp);color:#fff;font-weight:700;transform:rotate(-8deg)}
.cal .now{outline:2px solid var(--acc);outline-offset:-2px;color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:block;font-size:13px;color:var(--mute)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.save{background:var(--acc);color:#fff;font-weight:700;margin-top:10px;width:100%}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
td,th{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);font-weight:400}
th:first-child,td:first-child{text-align:left}
.up{color:var(--stamp)}.dn{color:var(--acc)}
ul{list-style:none;margin:14px 0 0;padding:0}
span.chip{display:inline-block;padding:8px 14px;border-radius:12px}li .drow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;width:100%;background:transparent;color:var(--ink);padding:8px 0;min-height:44px;text-align:left;border-radius:8px;font-size:15px}.vbtn{display:inline-flex;align-items:center;background:var(--hero);color:var(--onhero)!important;border-radius:12px;padding:8px 14px!important;min-height:40px;font-weight:700;text-decoration:none}.pcard{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);margin-top:14px}.pcard label{margin-top:8px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 14px;min-height:40px}.chip.sel{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}.info{flex-basis:100%;font-size:14px;color:var(--mute);line-height:1.5}.pick .tp{display:block}.rt{background:#070721;color:#fff;border-radius:22px;padding:18px 14px;margin-top:20px}.rt h2{color:#fff;font-size:24px;margin:0;flex:1}.rhd{display:flex;align-items:center;gap:6px}.rt button{font:inherit}.rhd button,.rt .more,.rt .pen{background:transparent;color:#C9CEE6;min-height:40px;min-width:36px;padding:0 6px;font-size:20px}.rt .pen{min-height:32px;min-width:32px;font-size:18px}.rt .ai{background:#12204f;color:#8DB0FF;border-radius:50%;width:44px;height:44px;padding:0}.rt .memo{color:#5B9BFF;background:transparent;padding:12px 0 0;min-height:0;font-size:15px;display:block}.rsec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 6px;font-weight:700;font-size:18px}.rsec button{background:#1B1F45;color:#E8EBFF;font-size:15px;padding:8px 14px;border-radius:12px;min-height:40px}.rrow{display:grid;grid-template-columns:64px 1fr 64px 30px;gap:8px;align-items:center;padding:10px 0}.th{width:64px;height:64px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:30px;border:1px solid #2A3366;padding:0;min-height:0;position:relative;background-size:cover;background-position:center}.rt .th{font-size:30px}.rt .th .cam{position:absolute;right:2px;bottom:2px;font-size:12px;line-height:1.2;background:rgba(7,7,33,.75);border-radius:8px;padding:1px 3px}.bars{display:flex;gap:2px}.bars i{width:12px;height:12px;border-radius:2px;background:#2A3366}.bars i.on2{background:#2F6BFF}.rm b{display:block;font-size:16px;line-height:1.3;margin-top:3px}.rs{color:#A9AFC4;font-size:14px}.mu{text-align:center;font-size:12px;font-weight:700}.fig{width:64px;height:64px;padding:0;min-height:0;border:1px solid #2A3366;border-radius:14px;background:#10143a;display:grid;place-items:center}.fig.pic{background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center}.rf{background:#10143a;border-radius:14px;padding:12px;margin:0 0 8px}.rf input{background:#0b0e30;color:#fff;border-color:#2A3366}.rf label{color:#A9AFC4}.rf select{background:#0b0e30;color:#fff;border-color:#2A3366}.rf .rr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.rmenu{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:8px}.rmenu button{background:#1B1F45;color:#fff;font-size:14px;padding:6px 12px;min-height:36px}.rt .chip{background:#1B1F45;color:#fff;border-color:#2A3366}.info2{color:#C9CEE6;font-size:14px}.zoom{background:#10143a;border-radius:14px;padding:10px;margin:0 0 8px}.zt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.zi{aspect-ratio:1;background:#fff no-repeat center/contain;border-radius:12px;display:grid;place-items:center;font-size:48px}.quote{border-left:4px solid var(--stamp);padding:6px 0 6px 14px;margin-top:24px}.quote p{margin:0;font-size:18px;font-weight:700;line-height:1.5}.shorts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shorts li{display:block;padding:0;border:0}.shot{position:relative;display:block;aspect-ratio:9/16;border-radius:16px;overflow:hidden;color:#fff;text-decoration:none;background-size:cover;background-position:center}.shot .ov{position:absolute;left:0;right:0;bottom:0;padding:32px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:14px;line-height:1.35}.shot .ov small{display:block;opacity:.85;color:#fff}.shot .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:18px}.shot .fv{position:absolute;top:8px;right:10px;font-size:18px}
li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
li small{color:var(--mute)}
li button{background:transparent;color:var(--mute);padding:6px 10px;min-height:36px}
li a{color:var(--acc);font-size:14px;margin-left:auto;padding:0 10px}
.add{display:grid;grid-template-columns:1fr 100px;gap:8px}
.add button{grid-column:1/-1}
.join{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.join button{grid-column:1/-1}.join .w{grid-column:1/-1}
.crew{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.slot{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);min-height:112px;display:flex;flex-direction:column;gap:4px}
.slot.me{border:2px solid var(--acc)}
.slot.empty{border-style:dashed;color:var(--mute);align-items:center;justify-content:center;text-align:center;font-size:14px;background:transparent}
.slot b{font-size:17px}
.st{font-size:14px;color:var(--mute)}.st.ok{color:var(--stamp);font-weight:700}
.toast{background:var(--hero);color:var(--onhero);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-weight:700}
li .yes{background:var(--acc);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:transparent;color:var(--mute);font-size:12px;line-height:1.25;padding:8px 2px;border-radius:10px}
nav button.cur{color:var(--acc);font-weight:700;background:var(--bg)}
@media(prefers-reduced-motion:no-preference){.on{animation:st .35s ease-out}@keyframes st{from{transform:scale(1.6) rotate(-20deg);opacity:0}}}
</style>
</head>

<script>
var KEY='inbody-routine-v1',PARTS=['가슴','등','하체','어깨·팔','복부','허리','코어','유산소','마사지'];

function wtChart(list,ym){
